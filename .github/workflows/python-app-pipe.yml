name: Python app pipeline

# Reusable workflow: test -> build -> Trivy scan -> (optional) push to GHCR.
# The image is scanned BEFORE it is pushed, so a vulnerable image never reaches the registry.

on:
  workflow_call:
    inputs:
      image-name:
        description: "Full image name, lowercase, e.g. ghcr.io/my-user/streamforge-app"
        type: string
        required: true
      python-version:
        type: string
        default: "3.12"
      test-command:
        type: string
        default: "python -m unittest discover -s tests -t . -v"
      trivy-report-severity:
        description: "Severities listed in the report artifact (does not block)"
        type: string
        default: "MEDIUM,HIGH,CRITICAL"
      trivy-fail-severity:
        description: "Severities that fail the pipeline"
        type: string
        default: "CRITICAL"
      push-image:
        description: "Push to GHCR after a successful scan"
        type: boolean
        default: false
    outputs:
      digest:
        description: "Digest of the pushed image (empty if not pushed)"
        value: ${{ jobs.build-scan-push.outputs.digest }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run tests
        run: ${{ inputs.test-command }}

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: local/scan-candidate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy report (never fails the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/scan-candidate:${{ github.sha }}
          version: v0.76.1
          format: table
          output: trivy-report.txt
          severity: ${{ inputs.trivy-report-severity }}
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30

      - name: Trivy gate (fails only on blocking severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/scan-candidate:${{ github.sha }}
          version: v0.76.1
          severity: ${{ inputs.trivy-fail-severity }}
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: inputs.push-image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        if: inputs.push-image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Push image
        if: inputs.push-image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha